name: Check for broken links on site

on:
  workflow_run:
    workflows: [Deploy paper site]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-links-on-site:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event != 'pull_request')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the deployed source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check published local links and build
        run: node scripts/build-paper-site.mjs
