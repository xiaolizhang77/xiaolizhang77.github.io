name: Deploy paper site

on:
  push:
    branches: [master, main]
    paths:
      - "index.html"
      - "404.html"
      - "blog.html"
      - "robots.txt"
      - "sitemap.xml"
      - "assets/proof-r1/**"
      - "scripts/build-paper-site.mjs"
      - ".github/workflows/deploy.yml"
  pull_request:
    branches: [master, main]
    paths:
      - "index.html"
      - "404.html"
      - "blog.html"
      - "robots.txt"
      - "sitemap.xml"
      - "assets/proof-r1/**"
      - "scripts/build-paper-site.mjs"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: paper-site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate and build the paper site
        run: node scripts/build-paper-site.mjs
      - name: Deploy to GitHub Pages
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: _site
          clean: true
