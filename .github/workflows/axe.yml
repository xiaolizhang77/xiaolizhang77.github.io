name: Axe accessibility testing

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Page path to check (Proof-R1/, XRAG/, or either project's blog.html; use / for the project index)"
        default: "Proof-R1/"
        required: false
        type: string

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build the paper site
        run: node scripts/build-paper-site.mjs
      - name: Get Chromium version
        run: |
          CHROMIUM_VERSION=$(curl --fail --silent https://googlechromelabs.github.io/chrome-for-testing/LATEST_RELEASE_STABLE | cut -d. -f1)
          echo "CHROMIUM_VERSION=$CHROMIUM_VERSION" >> "$GITHUB_ENV"
      - name: Set up Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: ${{ env.CHROMIUM_VERSION }}
      - name: Install accessibility tools
        run: npm install -g "chromedriver@$CHROMIUM_VERSION" @axe-core/cli http-server
      - name: Check accessibility
        env:
          CHECK_PATH: ${{ inputs.url || 'Proof-R1/' }}
        run: |
          http-server _site/ -a 127.0.0.1 -p 8080 > /tmp/proof-r1-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8080/ > /dev/null; then break; fi
            sleep 0.5
          done
          axe --chromedriver-path "$(npm root -g)/chromedriver/bin/chromedriver" "http://127.0.0.1:8080/${CHECK_PATH#/}" --load-delay=1500 --exit
