<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Research projects</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #fafafc;
        color: #17202e;
        font:
          18px/1.7 system-ui,
          sans-serif;
      }
      main {
        width: min(720px, calc(100% - 48px));
        margin: 15vh auto;
      }
      h1 {
        font-size: clamp(30px, 6vw, 42px);
        letter-spacing: -1px;
        margin: 0 0 36px;
      }
      a {
        display: block;
        padding: 26px 30px;
        border: 1px solid #e3e5ed;
        border-radius: 12px;
        color: inherit;
        background: white;
        text-decoration: none;
      }
      a:hover {
        border-color: #5351b9;
      }
      a + a {
        margin-top: 20px;
      }
      a:focus-visible {
        outline: 3px solid #7976d8;
        outline-offset: 5px;
      }
      strong {
        display: flex;
        justify-content: space-between;
        color: #5351b9;
        font-size: 24px;
      }
      p {
        margin: 12px 0 0;
      }
      small {
        display: block;
        color: #5f6877;
        font-size: 16px;
        margin-top: 6px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Research projects</h1>
      <a href="/Proof-R1/"
        ><strong>Proof-R1 <span aria-hidden="true">→</span></strong>
        <p>Learning to Prove, Not Just to Answer</p>
        <small>Reinforcement learning from formal verification for natural-language logical reasoning.</small></a
      >
      <a href="/XRAG/"
        ><strong>XRAG <span aria-hidden="true">→</span></strong>
        <p>eXamining the Core</p>
        <small>Benchmarking foundational components in advanced retrieval-augmented generation.</small></a
      >
    </main>
  </body>
</html>
